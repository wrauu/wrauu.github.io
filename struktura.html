<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dvůr královny Alžběty</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f0f0f;
            --card-bg: #f3ebd7;
            --card-border: #8b7355;
            --text-dark: #2a1f1d;
            --accent-red: #a82424;
            --gap-x: 12px;
            --gap-y: 40px;      /* Zvětšená hlavní mezera mezi řádky */
            --gap-y-half: 20px; /* Poloviční mezera */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Playfair Display', serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
        }

        main {
            flex-grow: 1;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1400px;
        }

        header {
            text-align: center;
            margin-bottom: 10px;
        }

        header p {
            color: #888;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Nápověda pro mobilní zařízení */
        .scroll-hint {
            display: block;
            color: #d4af37;
            font-size: 0.75rem;
            margin-top: 4px;
            font-style: italic;
        }

        @media (min-width: 1350px) {
            .scroll-hint {
                display: none;
            }
        }

        /* Obal pro zachování šířky a horizontální scrollování na malých displejích */
        .tree-wrapper {
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 15px;
        }

        /* Hlavní jednotná mřížka s přesnou minimální šířkou pro zachování čar */
        .court-grid {
            display: grid;
            grid-template-columns: repeat(7, 170px);
            grid-template-rows: 
                46px var(--gap-y-half)
                46px var(--gap-y)
                46px var(--gap-y)
                46px var(--gap-y-half)
                46px var(--gap-y)
                46px var(--gap-y-half)
                46px;
            column-gap: var(--gap-x);
            row-gap: 0;
            width: 1262px; /* 7 * 170px + 6 * 12px gap */
            margin: 0 auto;
            justify-items: center;
            align-items: center;
            position: relative;
        }

       /* SVG vrstva pro propojovací čáry */
        .connections-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .connections-layer path {
            fill: none;
            stroke: #8b7355;
            stroke-width: 2;
            stroke-dasharray: 2 2;
            stroke-linecap: round;
        }

        /* Kartičky postav (výška 46px) */
        .card {
            background: linear-gradient(180deg, #f7f1e3 0%, #e1d3b7 100%);
            border: 2px solid var(--card-border);
            border-radius: 6px;
            padding: 3px 6px;
            text-align: center;
            color: var(--text-dark);
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
            user-select: none;
            z-index: 2;
            
            width: 170px;
            height: 46px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: #d4af37;
        }

        .card.disabled {
            opacity: 0.3;
            cursor: default;
        }

        .card.disabled:hover {
            transform: none;
